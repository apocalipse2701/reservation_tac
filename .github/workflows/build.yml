name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Installer Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: |
          cp app/build/outputs/apk/simple/debug/app-simple-debug.apk GestionEnfants-sans-planning.apk
          cp app/build/outputs/apk/planning/debug/app-planning-debug.apk ResaSAD.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ResaSAD-apk
          path: |
            ResaSAD.apk
            GestionEnfants-sans-planning.apk

      - name: Notes de version
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # section « ## V » du CHANGELOG
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if(f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $V" > notes.md
          printf '\n---\nAvec le lien vers Planning Commandes : ResaSAD.apk. Sans planning : GestionEnfants-sans-planning.apk.\n' >> notes.md

      - name: Publier la dernière version (mises à jour automatiques)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          # le titre commence par le numéro de compilation : les anciennes versions de l'appli le lisent
          gh release create apk GestionEnfants-sans-planning.apk ResaSAD.apk --title "Version ${{ github.run_number }} (${VERSION}) — dernière" --notes-file notes.md

      - name: Publier la version numérotée (une fois par numéro)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "v${VERSION} existe déjà : pense à augmenter version.txt pour une nouvelle version."
          else
            gh release create "v${VERSION}" GestionEnfants-sans-planning.apk ResaSAD.apk --title "v${VERSION}" --notes-file notes.md --latest=false
          fi
